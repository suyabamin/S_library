<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#087F5B" />
      <stop offset="100%" stop-color="#0D5940" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <!-- Modern Hexagonal / Pentagonal Badge Shield -->
  <polygon points="50,6 92,24 92,68 50,96 8,68 8,24" fill="url(#shieldGrad)" stroke="#10B981" stroke-width="2" stroke-linejoin="round"/>
  <!-- Inner Ring / Border -->
  <polygon points="50,12 86,28 86,65 50,90 14,65 14,28" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>
  <!-- Central Emblem: Open Quran / Book with Pen & Star -->
  <g transform="translate(24, 28) scale(0.52)">
    <!-- Open Book Pages -->
    <path d="M50 72 C35 60 12 62 2 68 L2 20 C14 14 36 12 50 24 C64 12 86 14 98 20 L98 68 C88 62 65 60 50 72 Z" fill="#FFFFFF" />
    <path d="M50 24 L50 72" stroke="#087F5B" stroke-width="3" stroke-linecap="round"/>
    <!-- Page Lines -->
    <line x1="12" y1="32" x2="42" y2="35" stroke="#D1FAE5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="42" x2="42" y2="45" stroke="#D1FAE5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="52" x2="38" y2="55" stroke="#D1FAE5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="58" y1="35" x2="88" y2="32" stroke="#D1FAE5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="58" y1="45" x2="88" y2="42" stroke="#D1FAE5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="62" y1="55" x2="88" y2="52" stroke="#D1FAE5" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Rising Flame / Minaret Beacon -->
    <path d="M50 6 C47 13 42 16 50 22 C58 16 53 13 50 6 Z" fill="url(#goldGrad)" />
  </g>
</svg>
